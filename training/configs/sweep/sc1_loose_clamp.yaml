# SWEEP sc1_loose_clamp: SCRATCH etap 1: warunki v4like + shaping 400 + log_std<=0
#
# ODKRYCIE 2026-09-04 (docs 6.25): log_std ucieka w gore przez caly trening
# (7DOF scratch_3M 1.00 -> v23_12M 13.71; 6DOF s2 21.32). Przy std~21 obcinane
# jest 96 % skladowych akcji, |mu|=14.8 — polityka jest BANG-BANG. Premia
# entropijna rosnie z sigma, a po obcieciu dalszy wzrost NIE zmienia zachowania:
# darmowy dochod. INTERWENCJA: log_std_max (callback LogStdClamp).
# ent_coef zostaje nominalny wszedzie tam, gdzie trzeba eksploracji — clamp juz
# zamyka dochod, a ent_coef=0 grozi utknieciem w optimum "nie ruszaj sie".
#
# Ten bieg: force_gripper_closed=False, finger_press_gate=False, collision_cost=0.5, action_rate_cost=0.0, depress_shaping_k=400.0, log_std_max=0.0
# SCRATCH, ETAP 1 — warunki v4like (chwytak WOLNY, bez bramki palcowej,
# collision_cost 0.5, bez kary za szarpanie) + depress_shaping_k=400.
# To jedyny uklad, w ktorym 6DOF nauczyl sie zadania od zera (6.16); shaping
# jest konieczny, bo prog 12 mm bez niego jest funkcja SCHODKOWA (6.17).
# MODEL Z TEGO BIEGU NIE NADAJE SIE NA SPRZET — wolny chwytak oznacza
# klikanie czym popadnie. Zacieśnia go dopiero ft_sc1_v23.
# BAZA DO OCENY: 53/100 @h=1500 (s2/best_model w tym env, docs 6.24).

algorithm: PPO
policy: MlpPolicy
learning_rate: 0.0001
n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
policy_kwargs:
  net_arch:
  - 256
  - 256
  activation_fn: tanh
robot: Kinova3_6DOF
force_gripper_closed: false
finger_press_gate: false
finger_misuse_cost: 0.0
contact_speed_cost: 0.0
dense_align_coef: 0.05
collision_cost: 0.5
action_rate_cost: 0.0
depress_shaping_k: 400.0
depress_clip_buffer: 0.001
activation_depth: 0.012
base_x_offset: -0.1
total_timesteps: 4000000
horizon: 1000
random_order: true
board_pos_noise: 0.06
percep_pos_bias: 0.015
percep_pos_noise: 0.005
percep_axis_noise: 0.05
base_z_noise: 0.03
checkpoint_freq: 100000
log_dir: logs/board_6dof/sweep/sc1_loose_clamp
tensorboard_log: logs/tensorboard
log_std_max: 0.0
eval_freq: 100000
n_eval_episodes: 20
