# 6DOF: PRZEDLUZENIE BIEGU W OBWIEDNI SPRZETOWEJ, +6M (2026-09-25, docs 6.40)
# Start z modelu na sprzet: kinova_ft_lr/ppo_board_final.zip (23.82M) — pary n=40 w obwiedni
# sprzetowej: 32/40 (80 %), 4.03 wcisniecia/ep, 42.5 s, kolizje 10.6 kroku/ep (docs 6.39).
# BEZ ZMIAN wzgledem 6.39 (lr 3e-5, limity wg instrukcji, E-stop 20 N / 6 mm, h=2000,
# target_kl 0.03, log_std_max 0.0, ewaluacja 2 env co 200k) — sprawdzany jest sam czas uczenia,
# bo trend ewaluacji na koniec 6.39 nadal rosl (ostatnie punkty 13–17/20).
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_kinova_ft_lr2.yaml \
#       --resume logs/board_6dof/kinova_ft_lr/ppo_board_final.zip --timesteps 6000000





algorithm: PPO
policy: MlpPolicy

learning_rate: 0.00003
n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

robot: Kinova3_6DOF

# Reward v2.3 — NIETKNIETY. Zmienna niezalezna to wylacznie joint_vel_limits.
force_gripper_closed: true
finger_press_gate: true
finger_misuse_cost: 0.0
contact_speed_cost: 0.0
dense_align_coef: 0.05
collision_cost: 5.0
action_rate_cost: 0.02
depress_shaping_k: 400.0
depress_clip_buffer: 0.001
activation_depth: 0.0059   # = zatrzask przy pelnym skoku 6 mm
base_x_offset: -0.1

total_timesteps: 6000000
horizon: 2000
random_order: true

board_pos_noise: 0.06
percep_pos_bias: 0.015
percep_pos_noise: 0.005
percep_axis_noise: 0.05
base_z_noise: 0.03

# Instrukcja Gen3 R07, tab. 46 (limity ogolne); tryb twist = skalowanie proporcjonalne
joint_vel_limits: [1.39, 1.39, 1.39, 1.22, 1.22, 1.22]

log_std_max: 0.0
target_kl: 0.03

checkpoint_freq: 100000
eval_freq: 200000
n_eval_episodes: 20
log_dir: logs/board_6dof/kinova_ft_lr2
tensorboard_log: logs/tensorboard

button_estop_profile:
  f_start: 10.0
  f_peak: 20.0
  x_peak: 0.004
  f_after: 5.0
  snap_width: 0.0003
  x_stroke: 0.006
  latch: true

joint_vel_limit_mode: scale
eef_twist_limits: [0.5, 0.8727]
n_eval_envs: 2
