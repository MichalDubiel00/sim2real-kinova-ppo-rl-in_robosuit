# PPO for ButtonBoard-v0, original 7DOF baseline (run v4, docs 6.3).

algorithm: PPO
policy: MlpPolicy

learning_rate: 3.0e-4

n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95

clip_range: 0.2
clip_range_vf: null

ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

total_timesteps: 3_000_000      # ignored on --resume (--timesteps = additional steps)

horizon: 1000                   # episode length [control steps at 20 Hz]

random_order: true              # random target order per episode
board_pos_noise: 0.05           # per-episode board offset [m]

percep_pos_bias: 0.005          # per-episode perception bias [m]
percep_pos_noise: 0.002         # per-step perception noise [m]
percep_axis_noise: 0.02         # per-episode press-axis noise

checkpoint_freq: 100_000
log_dir: logs/board
tensorboard_log: logs/tensorboard
