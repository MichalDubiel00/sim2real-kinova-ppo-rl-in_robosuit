algorithm: PPO
policy: MlpPolicy

# Optymalizator
learning_rate: 3.0e-4

# Zbieranie danych (on-policy)
n_steps: 2048        # kroki na env przed aktualizacja (per VecEnv)
n_envs: 4            # liczba rownolegych srodowisk (VecEnv)
batch_size: 64       # mini-batch size podczas SGD
n_epochs: 10         # liczba epok SGD na zebrane dane

# Dyskontowanie i GAE
gamma: 0.99
gae_lambda: 0.95

# Clip PPO
clip_range: 0.2
clip_range_vf: null  # brak clip value function

# Regularyzacja
ent_coef: 0.01       # koef entropii (eksploracja)
vf_coef: 0.5
max_grad_norm: 0.5

# Architektura sieci
policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

# Trening
total_timesteps: 2_000_000

# Checkpointy i logi
checkpoint_freq: 100_000     # co ile krokow zapisujemy model
log_dir: logs/cylinder
tensorboard_log: logs/tensorboard
