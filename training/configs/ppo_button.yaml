algorithm: PPO
policy: MlpPolicy

learning_rate: 3.0e-4

n_steps: 2048
n_envs: 4
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95

clip_range: 0.2
clip_range_vf: null

ent_coef: 0.005      # mniejsza entropia — zadanie bardziej precyzyjne
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

total_timesteps: 2_000_000

checkpoint_freq: 100_000
log_dir: logs/button
tensorboard_log: logs/tensorboard
