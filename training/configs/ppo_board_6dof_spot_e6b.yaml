# 6DOF ETAP 6b — WARIANT B: LOSOWANIE limitu przyspieszen per epizod (2026-10-06, docs 6.46)
#
# WSPOLNY POWOD. Po 16M krokow treningu wewnatrz twardej obwiedni przyspieszen
# polityka NIE zinternalizowala jej — nauczyla sie na niej POLEGAC. Test bez
# ogranicznika: zadania ponad 5.2 w 62.0 % krokow PRZED trenigiem w obwiedni
# i 74.8 % PO nim, mediany +50 %. Ogranicznik stal sie czescia obiektu sterowania.
# Ryzyko: polityka jest dostrojona do NASZEJ semantyki przycinania, a firmware
# Kinovy ogranicza po swojemu — zerowy zapas na roznice implementacji.
#
# OBA WARIANTY startuja z TEGO SAMEGO checkpointu (e5, 74.12M) i maja po 4M krokow,
# zeby dalo sie je porownac na tych samych ziarnach. Uruchamiane SEKWENCYJNIE:
# dwa biegi po 8 srodowisk to 16 procesow na 12 rdzeniach i ~10 GB, czyli ryzyko OOM
# (incydent 14.09). Zmniejszenie n_envs do 4 odpada — zmienia rozmiar rolloutu,
# wiec i dynamike uczenia, i wyniki przestalyby byc porownywalne z cala seria.
#
# approach_speed_cost WYZEROWANE w obu (w 6.45 nie dal nic, p=0.34-1.0), wiec
# A i B roznia sie od siebie DOKLADNIE JEDNA rzecza.
#
# PUNKT WYJSCIA (e5 74.12M, n=40, pelna obwiednia): 38/40 (95 %), 17.5 s,
# kolizje 20.9 kroku/ep (mediana 9), misuse 0.2, ||da|| 0.998.
# Zadania ponad limit bez ogranicznika: 74.8 % krokow.
#
# KRYTERIUM POROWNANIA (zapisane PRZED biegami): ktory wariant bardziej obniza
# % krokow z ZADANIEM ponad limit (mierzone BEZ ogranicznika), nie tracac
# skutecznosci ponizej 90 % ani nie podnoszac kolizji powyzej 21 kroku/ep.

algorithm: PPO
policy: MlpPolicy

learning_rate: 0.00003
n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

robot: Kinova3_6DOF

# Reward v2.3 — NIETKNIETY poza kara za kontakt ze Spotem (ponizej).
# Nowe w tym biegu: scena ma bryle korpusu i przednia kamere.
init_qpos: [0.0, 1.4692, -2.2410, 3.1403, -2.0200, 3.1416]   # j1 = 0, symetryczna
spot_body: true
spot_front_cam: true
# 0.13, NIE 5.0 jak tablica: przy zmierzonych 446 krokach kontaktu na epizod
# kara wyniesie 446 x 0.13 / 225 = 0.26, czyli ~26 % nagrody zadania. Przy 5.0
# byloby -9.9 i polityka natychmiast nauczylaby sie stac.
spot_collision_cost: 5.0   # ZROWNANE z collision_cost tablicy
force_gripper_closed: true
finger_press_gate: true
finger_misuse_cost: 0.0
contact_speed_cost: 0.0
dense_align_coef: 0.05
collision_cost: 5.0
action_rate_cost: 0.3          # z etapu 3 (kurikulum 0.02 -> 0.3 dobieglo konca)
# Kara za zbyt szybki dojazd (docs 6.45). tau = czas, w ktorym ramie ma sie
# zatrzymac: v_dop = dystans / tau. Koszt 50 wyskalowany pomiarem (16 % nagrody).
approach_speed_cost: 0.0   # 6.45 nie dal nic
approach_brake_time: 0.30
# action_rate_cost_start USUNIETE: kurikulum dobieglo konca w etapie 3,
# kara zostaje na stalej wartosci docelowej 0.3
action_rate_anneal_steps: 2000000
# Staly punkt odniesienia kurikulum (frac = 0). BEZ TEGO wznowienie z 53.42M
# zaczeloby kare od nowa od 0.02 — ta sama pulapka co przy JointVelLimitCurriculum
# (docs 6.32). Przy 53.42M frac = (53423552-50223552)/2M > 1, wiec kara = 0.3 od razu.
action_rate_anneal_origin: 50223552
depress_shaping_k: 400.0
depress_clip_buffer: 0.001
activation_depth: 0.0059   # = zatrzask przy pelnym skoku 6 mm
base_x_offset: -0.34   # Spot 24 cm dalej (docs 6.42)

total_timesteps: 4000000
horizon: 2000
random_order: true

board_pos_noise: 0.06
percep_pos_bias: 0.015
percep_pos_noise: 0.005
percep_axis_noise: 0.05
base_z_noise: 0.03

# Instrukcja Gen3 R07, tab. 46 (limity ogolne); tryb twist = skalowanie proporcjonalne
joint_vel_limits: [1.39, 1.39, 1.39, 1.22, 1.22, 1.22]
# Instrukcja Gen3 R07 tab. 48 — TWARDE limity przyspieszen, 6 DoF. NIE 1.0 z tab. 49:
# tamta dotyczy wylacznie angular joystick / joint trajectory, a nasz tor to twist.
joint_acc_limits: [5.2, 5.2, 5.2, 10.0, 10.0, 10.0]
# Wariant B: limit losowany per epizod jako mnoznik bazy [0.6, 1.4], czyli
# j1-3 w zakresie 3.12-7.28 rad/s^2. Odbiera eksploatacji sens, zamiast ja karac —
# ta sama logika co base_z_noise i gain_noise. Zweryfikowane: losuje per epizod,
# baza nie dryfuje, wylosowana wartosc egzekwowana co do setnej.
joint_acc_limits_noise: [0.6, 1.4]

log_std_max: 0.0
target_kl: 0.03

checkpoint_freq: 100000
eval_freq: 200000
n_eval_episodes: 20
log_dir: logs/board_6dof/spot_e6b
tensorboard_log: logs/tensorboard

button_estop_profile:
  f_start: 10.0
  f_peak: 20.0
  x_peak: 0.004
  f_after: 5.0
  snap_width: 0.0003
  x_stroke: 0.006
  latch: true

joint_vel_limit_mode: scale
eef_twist_limits: [0.5, 0.8727]
n_eval_envs: 2
