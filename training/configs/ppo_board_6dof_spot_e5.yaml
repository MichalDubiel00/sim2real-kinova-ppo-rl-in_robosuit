# 6DOF ETAP 5: KARA ZA ZBYT SZYBKI DOJAZD DO CELU (2026-10-06, docs 6.45)
#
# POWOD. Etap 4 nalozyl twarde limity przyspieszen Gen3 (5.2 rad/s^2, tab. 48
# instrukcji R07) i to je ujawnilo jako NAJTWARDSZE ograniczenie dla tej polityki:
#   bez limitu (58.12M, n=100):              100/100, 5.5 s, kolizje 0.4 kroku/ep
#   z limitem, bez przetrenowania (n=40):     38/40,  25.0 s, kolizje 67.2
#   z limitem, po 6.8M treningu (n=40):       37/40,  26.4 s, kolizje 32.3
# Poprawa ISTOTNA (pary 30:10, p=0.0022, mediana 38 -> 16), ale krzywa sie
# WYPLASZCZYLA: 67.2 -> 52.9 -> 36.0 -> 32.3, czyli pierwsze 3M dalo -31, a kolejne
# 3.8M tylko -3.7. Dalszy trening na tej samej nagrodzie nie ma sensu.
#
# MECHANIZM. Polityka hamowala przed tablica gwaltownym przeskokiem komendy;
# limit przyspieszen ten hamulec obcina, wiec ramie dojezdza szybciej, niz zdoła
# wytracic predkosc. Istniejace czlony nagrody nie adresuja tego:
#   collision_cost i contact_speed_cost odpalaja PO kontakcie,
#   action_rate_cost karze szarpanie WSZEDZIE, nie tylko przy przeszkodzie.
# Nic nie mowi polityce, ze DO PRZESZKODY NALEZY DOJEZDZAC WOLNO — przy
# nieograniczonym przyspieszeniu nie musiala tego wiedziec.
#
# POSTAC CZLONU: kara za skladowa predkosci W STRONE celu ponad te, z ktorej da sie
# jeszcze wyhamowac: v_dop = dystans / approach_brake_time. Karany tylko nadmiar
# i tylko zblizanie — cofanie i ruch boczny wolne, zeby nie dlawic manewru obrotu
# nadgarstka. Geometria PRAWDZIWA (site_xpos), nie obserwacja z biasem percepcji.
#
# KALIBRACJA (zmierzona na modelu 66.12M, nie dobrana na oko):
#   tau 0.20 -> 5.3 % krokow z nadmiarem | tau 0.30 -> 11.1 % | tau 0.45 -> 19.1 %
#   mediana nadmiaru ~0.11 m/s, wiec przy koszcie 1.0 kara = 0.005 nagrody (nic).
#   Wybrane tau 0.30 (6 krokow sterowania na hamowanie) i koszt 50 -> kara 16 %
#   nagrody epizodu, zweryfikowane na epizodzie: +0.9615 -> +0.8019.
#
# ZMIENNA NIEZALEZNA: wylacznie approach_speed_cost. Scena, poza, montaz, limity
# predkosci I przyspieszen, E-stop, action_rate_cost — BEZ ZMIAN wobec etapu 4.
#
# KRYTERIA (zapisane PRZED biegiem, n=40, pelna obwiednia):
#   sukces etapu: kolizje < 10 krokow/ep I skutecznosc >= 90 %
#   przerwac:     skutecznosc < 70 % przy +2M albo kolizje rosnace wobec 32.3
#   punkty:       +1M, +2M, +4M, +8M
# Punkt wyjscia: 37/40 (92 %), 26.4 s, kolizje 32.3, misuse 2.0, ||da|| 1.085.
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e5.yaml \
#       --resume logs/board_6dof/spot_e4/checkpoints/ppo_board_66123552_steps.zip \
#       --timesteps 8000000
#
# USTERKA NAPRAWIONA PRZY OKAZJI (envs/button_board.py): clip przyspieszen byl
# PIERWSZY w haku, a kapy twist i limit predkosci zmienialy v PO nim i potrafily
# zmienic ja o wiecej, niz przyspieszenie dopuszcza — zmierzone j1 33.9 rad/s^2
# przy limicie 5.2. Clip przeniesiony NA KONIEC; po poprawce 0.0 % przekroczen
# we wszystkich konfiguracjach, maksima dokladnie 5.2.
#
# KOSZT LIMITU dla modelu 58.12M (czesciowy, 7 epizodow — pelne 40 w toku):
#   skutecznosc PRZEZYWA (7/7 sukcesow), ale czas 110 -> 266-1290 krokow (3-12x)
#   i kolizje 0.4 -> 33-129 krokow/epizod (DWA RZEDY WIELKOSCI), pojawia sie misuse.
# Mechanizm: polityka hamuje przed tablica gwaltownym przeskokiem komendy, a limit
# ten hamulec przycina — ramie dojezdza z predkoscia, ktorej nie zdazy wytracic.
#
# DLACZEGO BEZ KURIKULUM. Przy limicie PREDKOSCI kurikulum bylo konieczne, bo przy
# ciasnej obwiedni w ogole nie dochodzilo do kontaktu z grzybkiem i shaping glebokosci
# milczal (docs 6.32). Tu zadanie sie NIE zalamuje — sukcesy sa od pierwszego epizodu,
# wiec polityka ma z czego sie uczyc od kroku zero. Kurikulum dodaloby zmienna bez potrzeby.
#
# ZMIENNA NIEZALEZNA: wylacznie joint_acc_limits. Scena, poza, montaz, limity predkosci,
# E-stop i action_rate_cost BEZ ZMIAN wobec etapu 3.
#
# KRYTERIA (zapisane PRZED biegiem, n=40, scena e2b + limit przyspieszen):
#   sukces etapu: skutecznosc >= 90 % I kolizje < 5 krokow/ep I czas < 15 s
#   przerwac:     skutecznosc < 70 % przy +2M
#   punkty:       +1M, +2M, +4M, +8M
# Punkt wyjscia BEZ limitu (n=100): 100/100, 5.5 s, kolizje 0.4 kroku/ep, ||da|| 1.034.
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e4.yaml \
#       --resume logs/board_6dof/spot_e3/checkpoints/ppo_board_58123552_steps.zip \
#       --timesteps 8000000
# Nowy model jest pod tym wzgledem GORSZY od starego (95.4 % wobec 88 %) — krotkie,
# szybkie epizody kupiono szarpaniem.
#
# UWAGA O ZRODLE: limity 1.0/10.0 pochodza z ros2_kortex `joint_limits.yaml` i moga
# byc limitami PLANERA MoveIt, nie firmware (docs 6.31). Dlatego NIE nakladamy ich
# jako twardej obwiedni (`joint_acc_limits` zostaje wylaczone) — zbijamy PRZYCZYNE,
# czyli szarpanie komendy, a przyspieszenia mierzymy jako SKUTEK.
#
# DLACZEGO OBECNA KARA JEST MARTWA. Kara = action_rate_cost * ||da||^2 na krok,
# dzielone przez REWARD_NORM 225. Epizod skrocil sie z ~500 do 148 krokow, wiec przy
# 0.02 jej udzial w nagrodzie spadl z 8 % na **2 %**. Polityka nie ma powodu byc gladka.
#   c = 0.02 -> 0.023 na epizod (2 %)      c = 0.3 -> 0.34 (34 %)
#   c = 0.1  -> 0.11 (11 %)                 c = 0.5 -> 0.57 (57 %)
#
# DLACZEGO KURIKULUM, NIE SKOK. Filtr EMA po treningu (docs 6.42): wygladzenie do
# ||da|| 0.34 podnosi kolizyjnosc 56x, bo polityka hamuje przed tablica wlasnie
# przeskokiem komendy. Skokowe odebranie hamulca grozi utrata skutecznosci szybciej,
# niz polityka nauczy sie nowego. Kara jest kwadratowa, wiec SAMA SIE ZMNIEJSZA
# w miare wygladzania: przy c=0.3 i ||da|| 0.9 to juz 16 %, nie 34 %.
#
# ZMIENNA NIEZALEZNA: wylacznie action_rate_cost (0.02 -> 0.3 przez 2M krokow).
# Scena, poza, montaz, limity i E-stop BEZ ZMIAN wobec etapu 2b.
#
# KRYTERIA (zapisane PRZED biegiem, n=40 w scenie e2b):
#   sukces etapu:  skutecznosc >= 90 % I ||da|| < 0.9 I kroki ponad limitem acc < 50 %
#   PRZERWAC:      skutecznosc < 80 % na ktorymkolwiek punkcie kontrolnym
#   punkty:        +1M (51.22M), +2M (52.22M), +4M (54.22M), +8M (58.22M)
# Punkt odniesienia: 100/100, 7.4 s, kolizje 0.2 kroku/ep, ||da|| 1.317, acc 95.4 %.
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e3.yaml \
#       --resume logs/board_6dof/spot_e2b/checkpoints/ppo_board_50223552_steps.zip \
#       --timesteps 8000000
# cala skutecznosc mimo czterech wcisniec w 6/40 epizodow.
#
# ZMIANA: init_qpos -> [0.0, 1.4692, -2.2410, 3.1403, -2.0200, 3.1416]
#   j1 = 0 (podstawa na wprost), j6 BEZ ZMIAN wobec etapu 2 (3.1416), zeby
#   zmiennych bylo jak najmniej. Szesc wariantow j6 bylo rownowaznych na kazdej
#   mierzonej osi, wiec wybrano ten sam co poprzednio.
#
# ZWERYFIKOWANE (pelny szum treningowy, 4 ziarna, kazdy kandydat w OSOBNYM env):
#   asymetria |kat btn3 - kat btn4|  0.01 st.  (bylo: 8 vs 0 wcisniec)
#   align 8.4 st. (etap 2: 17.7)     dryf 30 krokow 0.0171 rad
#   kat btn0 18.0 st. przy szumie (5.3 bez szumu)   przyciskow w kadrze 3/5
#   kontakt przy starcie 0/4         dystans do celu 0.165 m   wymiar obs 120
#
# Reszta BEZ ZMIAN wobec etapu 2: base_x_offset -0.34, spot_body, spot_front_cam,
# spot_collision_cost 5.0, action_rate_cost 0.02.
#
# PUNKT WYJSCIA: checkpoint 42 223 552 z etapu 2 — ma juz opanowany dojazd
# w nowej geometrii (kolizje 3.0 kroku/ep wobec 89.5 w starej, kontakt ze Spotem
# 2.1 wobec 446.5, cztery przyciski wciskane). Brakuje mu WYLACZNIE btn4.
#
# UWAGA: j5 nadal na granicy -2.02 (limit -2.10) — ten sam rodzaj ograniczenia,
# ktory przy j1 dal asymetrie. Przy nastepnej iteracji zwolnic.
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e2b.yaml \
#       --resume logs/board_6dof/spot_e2/checkpoints/ppo_board_42223552_steps.zip \
#       --timesteps 12000000
#
# CO ZMIENIONE (dwie rzeczy, obie geometryczne):
#   base_x_offset  -0.10 -> -0.34   (Spot stoi 24 cm dalej od tablicy)
#   init_qpos      [0, 0.65, -1.89, 0, -0.6, -pi/2]
#               -> [-0.4, 1.4806, -2.5, 2.5145, -2.02, 3.1416]
#
# DLACZEGO ODSUNIECIE. Z bliska tablica rozpościera sie na duzy kat, wiec poza
# celujaca w nia wymaga pokreconej galezi kinematyki (j1 ~ -3.04, ramie nad
# wlasnym barkiem) — wszystkie takie pozy DRYFUJA 0.35-2.69 rad w 30 krokach
# zerowej akcji, czyli OSC ich nie utrzymuje. Zmierzone wzgledem odleglosci:
#   offset   manipulowalnosc najgorszego gniazda   zapas limitow   kat btn0
#   -0.18              0.0234                         0.050 rad      —
#   -0.26              0.0357                         0.192 rad    21.1 st.
#   -0.34              0.0502                         0.389 rad    18.0 st.
# Dostep ROSNIE z odlegloscia (z bliska ramie sie sklada i pracuje blisko
# osobliwosci). Zasieg Gen3 6DOF ~0.90 m, wymagany przy -0.34 to 0.78 m.
#
# ZWERYFIKOWANE przy PELNYM szumie treningowym (5 ziaren):
#   kat btn0 od osi kamery 18.0 st. (5.1-24.9)   przyciskow w kadrze 3-5
#   align 17.7 st. (bylo 89.9)   dystans do celu 0.256 m (trening widzial do 0.296)
#   dryf 30 krokow 0.0155 rad    kontakt przy starcie 0/5    wymiar obs 120
#
# Kryterium kadru ZLUZOWANE swiadomie: jeden znacznik ArUco daje poze 6D, a uklad
# gniazd omniboarda jest znany, wiec do wyliczenia WSZYSTKICH pieciu wystarczy
# jedna detekcja tablicy (tak dziala detect_dex_board.py). Nie trzeba 5/5 w kadrze.
#
# Reszta BEZ ZMIAN wzgledem etapu 1b (spot_collision_cost 5.0, action_rate_cost
# 0.02), zeby zmienna niezalezna byla sama geometria.
#
# UWAGA: scena i poza sa inne niz w CALEJ dotychczasowej historii — wyniki
# NIEPOROWNYWALNE z biegami 6.1-6.41. Potrzebny nowy punkt odniesienia.
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e2.yaml \
#       --resume logs/board_6dof/spot_e1b/checkpoints/ppo_board_38923552_steps.zip \
#       --timesteps 12000000
# kupila bezpieczenstwo od tablicy, placac zadaniem I ocieraniem o platforme.
# Koncowka biegu sie rozsypywala (ewaluacje 0.49 -> -0.71 -> -2.53), bieg
# zatrzymany na 33.00M.
#
# ZMIANA: spot_collision_cost 0.13 -> 5.0, czyli DOKLADNIE tyle co tablica.
# Dotkniecie platformy przestaje byc tansze od dotkniecia tablicy, wiec
# asymetria, ktora polityka wykorzystala, znika.
#
# BUDZET NAGRODY NA STARCIE (z checkpointu +2M, gdzie kontakt = 151.7 kroku/ep):
#     zadanie            +1.0 (epizod kompletny, REWARD_NORM 225)
#     tablica  50.1 x 5.0 / 225   = -1.11
#     Spot    151.7 x 5.0 / 225   = -3.37
#     razem                        = -3.5
# To GLEBOKA dziura i realne ryzyko, ze polityka nauczy sie NIERUCHOMIEC — tryb
# awarii z 6.20. Dlatego bieg jest DLUZSZY (12M zamiast 6M, decyzja uzytkownika):
# przy etapie 1 polityka odrobila -1.25 do okolic zera w 400k krokow, wiec
# zjechanie z -3.5 powinno zajac rzad 1-2M, a reszta idzie na zadanie.
# ep_rew_mean i punkty ewaluacji WYSTARTUJA GLEBOKO UJEMNE — to arytmetyka, nie awaria.
#
# action_rate_cost ZOSTAJE 0.02. Gladkosc to osobny etap; przy etapie 1 pogorszyla
# sie 1.247 -> 1.424, a krzywa filtru EMA (6.41) pokazuje, ze szarpanie jest NOSNE
# (wygladzenie do ||da|| 0.34 podnosi kolizyjnosc 56x). Dwie kary naraz = brak atrybucji.
#
# KRYTERIA (zapisane PRZED biegiem):
#   sukces etapu:   kolizje < 20 I kontakt ze Spotem < 20 I skutecznosc > 70 % (n=40)
#   przerwac:       jesli przy +2M skutecznosc < 50 % (ponizej punktu wyjscia etapu 1)
#                   albo ep_len przyklei sie do 2000 przy std < 0.5 (nieruchomienie)
#   punkty kontrolne: +2M (32.02M), +4M (34.02M), +8M (38.02M)
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e1b.yaml \
#       --resume logs/board_6dof/spot_e1/checkpoints/ppo_board_30023552_steps.zip \
#       --timesteps 12000000
# GEOMETRIA (zmierzona, nie przyjeta):
#   korpus: suma AABB 16 pudelek `boundingObject BODY_BO` z protos/Spot.proto
#           Z UWZGLEDNIENIEM obrotow szesciu z nich. W ramce podstawy ramienia
#           X -0.729..+0.266, Y +-0.139, Z -0.202..+0.002.
#   kamera: Kinect z Webotsa, wariant `foot FALSE` => geometria kolizyjna to
#           LISTWA SENSORA Box 0.28 x 0.038 x 0.064 (nie klocek 0.084 ze stojaka).
#           W ramce ramienia X +0.209..+0.273, Y +-0.140, Z -0.026..+0.012.
#           Na sprzecie jest INNA, mniejsza kamera — obrys Kinecta wziety swiadomie
#           jako BUFOR (decyzja uzytkownika 2026-10-01).
#   Montaz z TF: base_link -> gen3_base_link = [0.256, 0, 0.112], rotacja JEDNOSTKOWA.
#
# DLACZEGO ETAPAMI. Budzet nagrody w pelnej scenie: zadanie +1.0, istniejaca kara za
# tablice 89.5 kroku x 5.0 / 225 = -1.99, kara za Spota -0.26. Dolozenie TERAZ kary za
# szarpanie (-0.32) dawaloby start przy -1.57, gdzie najtanszym rozwiazaniem jest
# ZNIERUCHOMIEC — tryb awarii pieciu poprzednich prob naprawiania zachowania kara (6.20).
# Krzywa filtru EMA (6.41) pokazuje, ze szarpanie jest NOSNE: wygladzenie do ||da|| 0.34
# podnosi kolizyjnosc 56x. Najpierw geometria, gladkosc w etapie 2.
#
# action_rate_cost ZOSTAJE 0.02. Jedyne nowe zmienne to spot_body, spot_front_cam
# i spot_collision_cost. UWAGA: scena jest inna niz w 6.1-6.40 — wyniki
# NIEPOROWNYWALNE z cala poprzednia historia biegow.
#
# ep_rew_mean WYSTARTUJE OKOLO ZERA ALBO PONIZEJ. To arytmetyka kar w ciasnej scenie,
# nie awaria — zapisane z gory, zeby nie zinterpretowac tego opacznie przy checkpoincie.
#
# KRYTERIA (zapisane PRZED biegiem):
#   przejscie do etapu 2:  kolizje < 20 kroku/ep I skutecznosc > 70 % (n=40, pelna scena)
#   kontakt ze Spotem:     < 20 kroku/ep (ze 446)
#   przerwac i wrocic z kurikulum: jesli przy +2M kolizyjnosc ROSNIE wzgledem 89.5
#
# URUCHOMIENIE:
#   python training/train_board.py --config training/configs/ppo_board_6dof_spot_e1.yaml \
#       --resume logs/board_6dof/kinova_ft_lr2/checkpoints/ppo_board_28023552_steps.zip \
#       --timesteps 6000000




algorithm: PPO
policy: MlpPolicy

learning_rate: 0.00003
n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

robot: Kinova3_6DOF

# Reward v2.3 — NIETKNIETY poza kara za kontakt ze Spotem (ponizej).
# Nowe w tym biegu: scena ma bryle korpusu i przednia kamere.
init_qpos: [0.0, 1.4692, -2.2410, 3.1403, -2.0200, 3.1416]   # j1 = 0, symetryczna
spot_body: true
spot_front_cam: true
# 0.13, NIE 5.0 jak tablica: przy zmierzonych 446 krokach kontaktu na epizod
# kara wyniesie 446 x 0.13 / 225 = 0.26, czyli ~26 % nagrody zadania. Przy 5.0
# byloby -9.9 i polityka natychmiast nauczylaby sie stac.
spot_collision_cost: 5.0   # ZROWNANE z collision_cost tablicy
force_gripper_closed: true
finger_press_gate: true
finger_misuse_cost: 0.0
contact_speed_cost: 0.0
dense_align_coef: 0.05
collision_cost: 5.0
action_rate_cost: 0.3          # z etapu 3 (kurikulum 0.02 -> 0.3 dobieglo konca)
# Kara za zbyt szybki dojazd (docs 6.45). tau = czas, w ktorym ramie ma sie
# zatrzymac: v_dop = dystans / tau. Koszt 50 wyskalowany pomiarem (16 % nagrody).
approach_speed_cost: 50.0
approach_brake_time: 0.30
# action_rate_cost_start USUNIETE: kurikulum dobieglo konca w etapie 3,
# kara zostaje na stalej wartosci docelowej 0.3
action_rate_anneal_steps: 2000000
# Staly punkt odniesienia kurikulum (frac = 0). BEZ TEGO wznowienie z 53.42M
# zaczeloby kare od nowa od 0.02 — ta sama pulapka co przy JointVelLimitCurriculum
# (docs 6.32). Przy 53.42M frac = (53423552-50223552)/2M > 1, wiec kara = 0.3 od razu.
action_rate_anneal_origin: 50223552
depress_shaping_k: 400.0
depress_clip_buffer: 0.001
activation_depth: 0.0059   # = zatrzask przy pelnym skoku 6 mm
base_x_offset: -0.34   # Spot 24 cm dalej (docs 6.42)

total_timesteps: 8000000
horizon: 2000
random_order: true

board_pos_noise: 0.06
percep_pos_bias: 0.015
percep_pos_noise: 0.005
percep_axis_noise: 0.05
base_z_noise: 0.03

# Instrukcja Gen3 R07, tab. 46 (limity ogolne); tryb twist = skalowanie proporcjonalne
joint_vel_limits: [1.39, 1.39, 1.39, 1.22, 1.22, 1.22]
# Instrukcja Gen3 R07 tab. 48 — TWARDE limity przyspieszen, 6 DoF. NIE 1.0 z tab. 49:
# tamta dotyczy wylacznie angular joystick / joint trajectory, a nasz tor to twist.
joint_acc_limits: [5.2, 5.2, 5.2, 10.0, 10.0, 10.0]

log_std_max: 0.0
target_kl: 0.03

checkpoint_freq: 100000
eval_freq: 200000
n_eval_episodes: 20
log_dir: logs/board_6dof/spot_e5
tensorboard_log: logs/tensorboard

button_estop_profile:
  f_start: 10.0
  f_peak: 20.0
  x_peak: 0.004
  f_after: 5.0
  snap_width: 0.0003
  x_stroke: 0.006
  latch: true

joint_vel_limit_mode: scale
eef_twist_limits: [0.5, 0.8727]
n_eval_envs: 2
