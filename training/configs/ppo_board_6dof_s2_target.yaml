# Kurikulum 6DOF, ETAP 2 — WARUNKI DOCELOWE (2026-08-01)
#
# Fine-tune z najlepszego modelu etapu 1 (czysty scratch, s1_clean, 12M).
# Etap 1 byl KURIKULUM: horyzont 2000 i prog 10 mm istnialy po to, zeby
# polityka w ogole domknela sekwencje 5 przyciskow i zobaczyla
# COMPLETE_BONUS. Tutaj wracamy do protokolu docelowego = tego samego,
# na ktorym mierzony byl 7DOF (v2.3, 90/100):
#   horizon      2000 -> 1000   (protokol porownywalny z 7DOF)
#   activation_depth 0.010 -> 0.012  (prog nominalny przycisku)
#
# UWAGA METODOLOGICZNA: to sa DWIE zmiany naraz. Robimy je swiadomie jako
# oddzielny, stacjonarny etap (staly config od kroku 0 fine-tune'u), a NIE
# doklejane w trakcie biegu — to wlasnie doklejanie zmian do uczacej sie
# polityki skazilo przebieg s1_contaminated (docs 6.13). Jesli mimo to
# sukces sie zalamie, fallback = rozdzielic: najpierw 12 mm przy horyzoncie
# 2000, potem dopiero horyzont 1000.
#
# Hiperparametry PPO nadal identyczne jak v4/s1_clean — swiadomie nie
# zmieniamy wielu rzeczy naraz (w tym LR: bez wygaszania, zeby fine-tune
# byl porownywalny z historia projektu).
algorithm: PPO
policy: MlpPolicy

learning_rate: 3.0e-4

n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95

clip_range: 0.2
clip_range_vf: null

ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

robot: Kinova3_6DOF

# Reward v2-like + shaping glebokosci — BEZ ZMIAN vs s1_clean.
# Zmieniamy wylacznie prog aktywacji i horyzont (patrz naglowek).
finger_press_gate: false
finger_misuse_cost: 0.0
contact_speed_cost: 0.0
dense_align_coef: 0.05
collision_cost: 0.5
action_rate_cost: 0.0
depress_shaping_k: 400.0
activation_depth: 0.012

total_timesteps: 3_000_000
horizon: 1000

random_order: true
board_pos_noise: 0.05
percep_pos_bias: 0.005
percep_pos_noise: 0.002
percep_axis_noise: 0.02

checkpoint_freq: 100_000
log_dir: logs/board_6dof/s2_target
tensorboard_log: logs/tensorboard
