# 6DOF curriculum stage 1 (docs 6.8): scratch under reward-v2 conditions (no finger gate,
# collision 0.5, no action-rate penalty). The first attempt with v2.1 penalties learned to avoid
# the board. Robot Kinova3_6DOF (obs 120). Results invalidated by the geometry audit (docs 6.15).

algorithm: PPO
policy: MlpPolicy

learning_rate: 3.0e-4

n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95

clip_range: 0.2
clip_range_vf: null

ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

robot: Kinova3_6DOF             # Kinova3_6DOF = lab Gen3 6DOF (obs 120); Kinova3 = stock 7DOF (obs 128)

finger_press_gate: false        # a press counts only with a finger on the cap
finger_misuse_cost: 0.0         # v2.5 penalty, rejected (docs 6.6)
contact_speed_cost: 0.0         # v2.5 penalty, rejected (docs 6.6)
dense_align_coef: 0.05          # axis-alignment dense term
collision_cost: 0.5             # per-step arm-board/wall contact penalty
action_rate_cost: 0.0           # penalty on ||a_t - a_{t-1}||^2
depress_shaping_k: 400.0        # potential shaping on cap depression
activation_depth: 0.010         # cap travel counted as a press [m]

total_timesteps: 6_000_000      # ignored on --resume (--timesteps = additional steps)
horizon: 1000                   # episode length [control steps at 20 Hz]

random_order: true              # random target order per episode
board_pos_noise: 0.05           # per-episode board offset [m]
percep_pos_bias: 0.005          # per-episode perception bias [m]
percep_pos_noise: 0.002         # per-step perception noise [m]
percep_axis_noise: 0.02         # per-episode press-axis noise

checkpoint_freq: 100_000
log_dir: logs/board_6dof/s1
tensorboard_log: logs/tensorboard
