# 6DOF tightening to the full v2.3 reward (docs 6.18).
# Start: depress_ft 14.23M (80/100). Changes: force_gripper_closed, finger_press_gate,
# collision_cost 0.5 -> 5.0, action_rate_cost 0 -> 0.02; depth shaping kept.
# Result: peak 52/100 @h=1000 at 16.43M (best_model, 8.8 collision steps), then collapse to 1/100.
#   python training/train_board.py --config training/configs/ppo_board_6dof_s2.yaml \
#     --resume logs/board_6dof/depress_ft/ppo_board_final.zip --timesteps 6000000

algorithm: PPO
policy: MlpPolicy

learning_rate: 3.0e-4

n_steps: 2048
n_envs: 8
batch_size: 64
n_epochs: 10

gamma: 0.99
gae_lambda: 0.95

clip_range: 0.2
clip_range_vf: null

ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

policy_kwargs:
  net_arch: [256, 256]
  activation_fn: tanh

robot: Kinova3_6DOF             # Kinova3_6DOF = lab Gen3 6DOF (obs 120); Kinova3 = stock 7DOF (obs 128)

force_gripper_closed: true      # gripper action overridden to closed
finger_press_gate: true         # a press counts only with a finger on the cap
finger_misuse_cost: 0.0         # v2.5 penalty, rejected (docs 6.6)
contact_speed_cost: 0.0         # v2.5 penalty, rejected (docs 6.6)
dense_align_coef: 0.05          # axis-alignment dense term
collision_cost: 5.0             # per-step arm-board/wall contact penalty
action_rate_cost: 0.02          # penalty on ||a_t - a_{t-1}||^2
depress_shaping_k: 400.0        # potential shaping on cap depression
activation_depth: 0.012         # cap travel counted as a press [m]

base_x_offset: -0.10            # Spot stand-off: arm base shift toward the wall [m]

total_timesteps: 6_000_000      # ignored on --resume (--timesteps = additional steps)
horizon: 1000                   # episode length [control steps at 20 Hz]

random_order: true              # random target order per episode
board_pos_noise: 0.05           # per-episode board offset [m]
percep_pos_bias: 0.005          # per-episode perception bias [m]
percep_pos_noise: 0.002         # per-step perception noise [m]
percep_axis_noise: 0.02         # per-episode press-axis noise

checkpoint_freq: 100_000
log_dir: logs/board_6dof/s2
tensorboard_log: logs/tensorboard
